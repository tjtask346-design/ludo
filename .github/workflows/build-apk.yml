name: build-apk-release

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Generate Android folder
        run: flutter create --platforms=android --project-name=ludo_app .
      - run: flutter pub get
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi
      - name: Upload APKs to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Auto-built from ${{ github.sha }}
            - app-arm64-v8a-release.apk (modern phones)
            - app-armeabi-v7a-release.apk (older 32-bit)
            - app-x86_64-release.apk (emulators)
          files: |
            app/build/app/outputs/apk/release/*.apk
          make_latest: true
