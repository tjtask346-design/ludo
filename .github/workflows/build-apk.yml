name: build-apk-release

on:
  push:
    branches: [main]
    paths: ['app/**', 'admin/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
      - run: flutter create --platforms=android --project-name=ludo_app .
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - name: Upload Game APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: |
            app/build/app/outputs/apk/release/*.apk
          make_latest: true

  build-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
      - run: flutter create --platforms=android --project-name=ludo_admin .
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename Admin APK
        run: mv build/app/outputs/apk/release/app-release.apk build/app/outputs/apk/release/ludo-admin.apk
      - name: Upload Admin APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            admin/build/app/outputs/apk/release/ludo-admin.apk
